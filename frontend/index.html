<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <meta
      name="description"
      content="ツミビット — BTC自動積立"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ツミビット</title>
    <script>
      (function () {
        var KEY = 'tumibit-theme';
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        function apply(mode) {
          var effective = mode === 'system' ? (mq.matches ? 'light' : 'dark') : mode;
          document.documentElement.setAttribute('data-theme', effective);
        }
        window.tumibitTheme = {
          get: function () { return localStorage.getItem(KEY) || 'system'; },
          set: function (m) { localStorage.setItem(KEY, m); apply(m); },
        };
        apply(window.tumibitTheme.get());
        mq.addEventListener('change', function () {
          if (window.tumibitTheme.get() === 'system') apply('system');
        });
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
