name: Monthly BTC Purchase

on:
  schedule:
    - cron: '0 0 28 * *'  # 毎月28日の0:00 UTC (日本時間9:00)に実行
  workflow_dispatch:
    inputs:
      confirmation:
        description: '実注文を行うには BUY BTC と入力'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: monthly-btc-purchase
  cancel-in-progress: false

jobs:
  buy-btc:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm manual real-money order
        if: github.event_name == 'workflow_dispatch' && inputs.confirmation != 'BUY BTC'
        run: |
          echo 'Confirmation did not match; refusing to place an order.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r github-actions/requirements.txt

      - name: Resolve original run time
        id: original-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')
          if [[ ! "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            exit 1
          fi
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"

      - name: Run the script
        env:
          GMO_API_KEY: ${{ secrets.GMO_API_KEY }}
          GMO_API_SECRET: ${{ secrets.GMO_API_SECRET }}
          DCA_RUN_CREATED_AT: ${{ steps.original-run.outputs.created_at }}
          DCA_ORDER_FREQUENCY: ${{ vars.DCA_ORDER_FREQUENCY }}
          INVESTMENT_AMOUNT: ${{ secrets.INVESTMENT_AMOUNT }}
        run: python github-actions/btc_purchase.py
