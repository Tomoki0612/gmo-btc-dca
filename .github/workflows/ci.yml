name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aws-lambda/auto-purchase/requirements.txt
      - run: pip install -r aws-lambda/auto-purchase/requirements.txt boto3
      - run: python -m unittest discover -s aws-lambda -p 'test*.py' -v
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
      - run: python -m unittest discover -s github-actions -p 'test*.py' -v
      - run: sam validate --lint --template-file aws-lambda/template.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_API_BASE_URL: https://example.execute-api.ap-northeast-1.amazonaws.com/prod
      REACT_APP_COGNITO_USER_POOL_ID: ap-northeast-1_example
      REACT_APP_COGNITO_USER_POOL_CLIENT_ID: exampleclientid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
