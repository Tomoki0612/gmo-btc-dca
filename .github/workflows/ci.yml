name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aws-lambda/auto-purchase/requirements.txt
      - run: pip install -r aws-lambda/auto-purchase/requirements.txt boto3
      - run: python -m unittest discover -s aws-lambda -p 'test*.py' -v
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file aws-lambda/template.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_API_BASE_URL: https://example.execute-api.ap-northeast-1.amazonaws.com/prod
      REACT_APP_COGNITO_USER_POOL_ID: ap-northeast-1_example
      REACT_APP_COGNITO_USER_POOL_CLIENT_ID: exampleclientid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
